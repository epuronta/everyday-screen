[project]
name = "everyday-screen"
version = "0.1.0"
description = "Backend renderer for a home hallway display screen"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "icalendar>=6",
    "jinja2>=3.1.6",
    "playwright>=1.58.0",
    "python-dateutil>=2.9",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.4",
    "pytest-cov>=6",
    "ruff>=0.15.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# app/ is imported as a package from the repo root; the project isn't installed.
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package
    "D101",   # missing docstring in public class
    "D102",   # missing docstring in public method
    "D103",   # missing docstring in public function
    "D105",   # missing docstring in magic method
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "ANN201", # missing return type annotation
    "T201",   # print statements
    "COM812", # conflicts with ruff formatter
    # FIXME comments are used deliberately to mark known-but-unfixed behaviour
    # (usually alongside a test that encodes it). There's no issue tracker to
    # link to and one author, so the bookkeeping rules are noise.
    "TD001",  # FIXME is not an accepted tag
    "TD002",  # missing author
    "TD003",  # missing issue link
    "FIX001", # line contains FIXME
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # assert is the point of a test
    "PLR2004", # magic values are the expected values
    "SLF001",  # tests exercise private helpers directly
    "INP001",  # tests/ is deliberately not a package
    "ANN001",  # fixture params don't need annotations
]
